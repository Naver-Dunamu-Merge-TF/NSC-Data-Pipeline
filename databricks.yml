bundle:
  name: data-pipeline

variables:
  catalog:
    description: Unity Catalog name
  cluster_policy_id:
    description: Cluster policy id
  rule_load_mode:
    description: Runtime rule load mode for Pipeline A/B/Silver (strict|fallback)
  rule_table:
    description: Runtime rule table name for Pipeline A/B/Silver
  rule_seed_path:
    description: Fallback seed path for Pipeline A/B/Silver
  run_as_principal:
    description: Service principal used as run_as execution identity
  secret_scope:
    description: Secret scope for Pipeline C anonymization salt lookup
  secret_key:
    description: Secret key for Pipeline C anonymization salt lookup
targets:
  dev:
    default: true
    variables:
      catalog: nsc_dbw_dev_7405610275478542
      cluster_policy_id: "0004CF01E53A5F6F"
      rule_load_mode: fallback
      rule_table: gold.dim_rule_scd2
      rule_seed_path: mock_data/fixtures/dim_rule_scd2.json
      run_as_principal: "eb69a479-7a7d-4e2b-9cba-05d2262d8d3c"
      secret_scope: ledger-analytics-dev
      secret_key: salt_user_key

  prod:
    variables:
      catalog: prod_catalog
      cluster_policy_id: "<prod-cluster-policy-id>"
      rule_load_mode: strict
      rule_table: gold.dim_rule_scd2
      rule_seed_path: mock_data/fixtures/dim_rule_scd2.json
      run_as_principal: "<sec005-prod-service-principal>"
      secret_scope: "<prod-secret-scope>"
      secret_key: "<prod-secret-key>"

resources:
  jobs:
    pipeline_a_guardrail:
      name: data-pipeline-a-${bundle.target}
      max_concurrent_runs: 2
      timeout_seconds: 3600
      performance_target: STANDARD
      run_as:
        service_principal_name: ${var.run_as_principal}
      schedule:
        quartz_cron_expression: "0 0/10 * * * ?"
        timezone_id: Asia/Seoul
      email_notifications:
        on_failure:
          - 2dt026@msacademy.msai.kr
      parameters:
        - name: run_mode
          default: incremental
        - name: start_ts
          default: ""
        - name: end_ts
          default: ""
        - name: date_kst_start
          default: ""
        - name: date_kst_end
          default: ""
        - name: run_id
          default: ""
        - name: rule_load_mode
          default: ${var.rule_load_mode}
        - name: rule_table
          default: ${var.rule_table}
        - name: rule_seed_path
          default: ${var.rule_seed_path}
      environments:
        - environment_key: pipeline_a_serverless
          spec:
            environment_version: "2"
      tasks:
        - task_key: run_pipeline_a
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 300000
          environment_key: pipeline_a_serverless
          spark_python_task:
            python_file: scripts/run_pipeline_a.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--run-mode"
              - "{{job.parameters.run_mode}}"
              - "--start-ts"
              - "{{job.parameters.start_ts}}"
              - "--end-ts"
              - "{{job.parameters.end_ts}}"
              - "--date-kst-start"
              - "{{job.parameters.date_kst_start}}"
              - "--date-kst-end"
              - "{{job.parameters.date_kst_end}}"
              - "--run-id"
              - "{{job.parameters.run_id}}"
              - "--rule-load-mode"
              - "{{job.parameters.rule_load_mode}}"
              - "--rule-table"
              - "{{job.parameters.rule_table}}"
              - "--rule-seed-path"
              - "{{job.parameters.rule_seed_path}}"

