      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 20 0 * * ?"
        timezone_id: Asia/Seoul
      email_notifications:
        on_failure:
          - 2dt026@msacademy.msai.kr
      parameters:
        - name: run_mode
          default: incremental
        - name: start_ts
          default: ""
        - name: end_ts
          default: ""
        - name: date_kst_start
          default: ""
        - name: date_kst_end
          default: ""
        - name: run_id
          default: ""
      job_clusters:
        - job_cluster_key: policy_single_node
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            num_workers: 0
            node_type_id: Standard_DS3_v2
            policy_id: ${var.cluster_policy_id}
      tasks:
        - task_key: run_pipeline_c
          job_cluster_key: policy_single_node
          spark_python_task:
            python_file: scripts/run_pipeline_c.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--run-mode"
              - "{{job.parameters.run_mode}}"
